[package]
name = "cce-sheets"
version = "0.1.0"
edition = "2021"
description = "Spreadsheets for the cce desktop: Excel-compatible workbooks on the IronCalc engine"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "ec907daa331c6d8b6eaeba5b0ee8ea678a67043a" }
# The spreadsheet engine: cells, formulas, styles, selection and undo, plus
# .xlsx import/export (MIT OR Apache-2.0).
ironcalc = "0.8.3"
csv = "1.3"
# Reads the fields of IronCalc's clipboard, which it keeps private but serializes.
serde_json = "1"
# The MCP server hands tool calls to the event loop through a calloop channel.
calloop = "0.13.0"
log = "0.4"
env_logger = "0.11"
